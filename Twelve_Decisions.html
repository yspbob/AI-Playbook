    return '<div class="chip"><i style="background:var(--'+esc(k)+')"></i>'
      + '<span data-f="'+i+'.evidence">'+esc(LABEL[k]||k)+'</span>'
      + (p.source ? '<s><span data-f="'+i+'.source">'+esc(p.source)+'</span></s>' : '') + '</div>';
  }
  function foot(p, i){ return '<p class="foot" data-f="'+i+'.footnote">'+md(p.footnote||'')+'</p>'; }
  function gap(h){ return '<div style="height:'+h+'px"></div>'; }

  var R = {
    cover: function(p,i){
      return '<div class="mark"></div>'
        + '<div class="kick"><a href="'+esc(BASE)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span data-f="'+i+'.kicker">'+md(p.kicker)+'</span></a></div>'+gap(58)
        + '<h1 data-f="'+i+'.title">'+nl(p.title)+'</h1>'+gap(50)
        + '<p class="lede mute" data-f="'+i+'.lede">'+md(p.lede)+'</p>'
        + '<div class="spacer"></div>'
        + '<div class="legend">'
          + ['published','reasoned','firsthand','judgement'].map(function(k){
              return '<span><i style="background:var(--'+k+')"></i>'+LABEL[k]+'</span>'; }).join('')
        + '</div>' + foot(p,i);
    },
    stat: function(p,i){
      return head(p,i) + '<h2 data-f="'+i+'.title">'+nl(p.title)+'</h2>'+gap(56)
        + '<div class="figs">' + p.figures.map(function(x,j){
            return '<div><b data-f="'+i+'.figures.'+j+'.number">'+esc(x.number)+'</b><span data-f="'+i+'.figures.'+j+'.label">'+esc(x.label)+'</span></div>';
          }).join('') + '</div>' + gap(56)
        + '<p class="lede" data-f="'+i+'.lede">'+md(p.lede)+'</p>'+gap(34)
        + '<p class="lede" data-f="'+i+'.lede2">'+md(p.lede2)+'</p>'
        + chip(p,i) + '<div class="spacer"></div>' + foot(p,i);
    },
    map: function(p,i){
      return head(p,i) + '<h3 style="margin-bottom:44px" data-f="'+i+'.title">'+nl(p.title)+'</h3>'
        + p.groups.map(function(g,j){
            return '<div class="grp"><h4 data-f="'+i+'.groups.'+j+'.name">'+esc(g.name)+'</h4>'
              + g.items.map(function(it,k){
                  var b = i+'.groups.'+j+'.items.'+k;
                  return '<div class="row"><span data-f="'+b+'.n">'+esc(it.n)+'</span>'
                    + '<span style="width:auto;font-family:var(--sans);font-weight:400;color:var(--ink)" data-f="'+b+'.text">'+esc(it.text)+'</span></div>';
                }).join('') + '</div>';
          }).join('')
        + '<div class="spacer"></div>' + foot(p,i);
    },
    decision: function(p,i){
      return head(p,i) + '<h2 data-f="'+i+'.title">'+nl(p.title)+'</h2>'+gap(50)
        + '<div class="fork">'
          + '<div class="opt"><div class="lbl">By default</div>'+f(i+'.usually', md(p.usually))+'</div>'
          + '<div class="opt pick"><div class="lbl">By choice</div>'+f(i+'.instead', md(p.instead))+'</div>'
        + '</div>' + gap(20)
        + '<p class="why" data-f="'+i+'.why">'+md(p.why)+'</p>'
        + chip(p,i) + '<div class="spacer"></div>' + foot(p,i);
    },
    pattern: function(p,i){
      return head(p,i) + '<h2 data-f="'+i+'.title">'+nl(p.title)+'</h2>'+gap(50)
        + '<p class="lede" data-f="'+i+'.lede">'+md(p.lede)+'</p>'+gap(44)
        + '<p class="why" data-f="'+i+'.why">'+md(p.why)+'</p>'+gap(38)
        + '<p class="lede" data-f="'+i+'.lede2">'+md(p.lede2)+'</p>'
        + chip(p,i) + '<div class="spacer"></div>' + foot(p,i);
    },
    questions: function(p,i){
      return head(p,i) + '<h2 data-f="'+i+'.title">'+nl(p.title)+'</h2>'+gap(52)
        + '<ol class="q">' + p.questions.map(function(q,j){
            return '<li data-f="'+i+'.questions.'+j+'">'+esc(q)+'</li>'; }).join('') + '</ol>'
        + gap(14) + '<p class="lede" data-f="'+i+'.lede">'+md(p.lede)+'</p>'
        + '<div class="spacer"></div>' + foot(p,i);
    },
    end: function(p,i){
      return '<div class="mark"></div>'
        + '<div class="kick" data-f="'+i+'.kicker">'+esc(p.kicker)+'</div>'+gap(44)
        + '<h2 data-f="'+i+'.title">'+nl(p.title)+'</h2>'+gap(44)
        + '<p class="lede" data-f="'+i+'.lede">'+md(p.lede)+'</p>'+gap(44)
        + '<p style="font-size:29px;line-height:1.5"><a class="link" href="'+esc(BASE)+'" target="_blank" rel="noopener"><span data-f="'+i+'.url">'+esc(p.url)+'</span></a></p>'+gap(40)
        + '<p class="why" data-f="'+i+'.why">'+md(p.why)+'</p>'
        + '<div class="spacer"></div>' + foot(p,i);
    }
  };

  function render(){
    var stage = document.getElementById('stage');
    stage.innerHTML = DATA.pages.map(function(p,i){
      var fn = R[p.type];
      return '<section class="page">' + (fn ? fn(p,i) : '<p>Unknown page type: '+esc(p.type)+'</p>')
        + '<span class="pgno">'+(i+1)+'</span></section>';
    }).join('');
    fit();
  }

  function fit(){
    var s = Math.min(1, (window.innerWidth - 52) / 1080);
    document.querySelectorAll('.page').forEach(function(el){
      el.style.transform = 'scale('+s+')';
      el.style.transformOrigin = 'top center';
      el.style.marginBottom = (1350*s - 1350) + 'px';
    });
  }
  window.addEventListener('resize', fit);

  document.getElementById('printBtn').onclick = function(){ window.print(); };

  render();
})();
</script>
</body>
</html>
